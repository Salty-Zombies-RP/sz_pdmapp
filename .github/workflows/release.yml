name: Building & Releasing

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Update Manifest Version
      run: |
         sed -i "s|^version \"[^\"]*\"|version \"${VERSION}\"|" fxmanifest.lua

    - name: Create Releasable
      run: |
       ls -alr
       rm -rf .github
       rm -rf .git
       cd ..
       zip -r sz_pdmapp/sz_pdmapp-${VERSION}.zip sz_pdmapp/ -x "sz_pdmapp/sz_pdmapp-*.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
          name: sz_pdmapp-${{ github.ref_name }}
          path: sz_pdmapp-${{ github.ref_name }}.zip

    - name: Upload renamed release asset
      uses: softprops/action-gh-release@v2
      with:
        files: sz_pdmapp-${{ github.ref_name }}.zip
